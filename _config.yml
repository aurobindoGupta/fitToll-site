title: FitToll

# tagline is the visible footer text. description is the meta description and
# is never rendered on screen -- they were the same key until this split, which
# is why every page shipped a 22-character meta description.
tagline: Pay the toll to scroll
description: >-
  FitToll blocks the apps you doomscroll. To open one, do camera-verified
  push-ups or squats — real pose detection, no skip button, nothing leaves
  your phone.

url: https://fittoll.com
theme: minima
permalink: pretty

# Listed explicitly because we can't build locally to catch a silent drop:
# seo-tag and feed arrive via the minima theme today, and naming them here
# keeps that true if the theme's dependencies ever change. sitemap is new.
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Header nav: the three pages we want to rank. Legal lives in the footer nav.
header_pages:
  - exercise-app-blocker.md
  - no-skip-button.md
  - unlock-timer.md

# jekyll-titles-from-headings is auto-enabled by GH Pages. Tell it to leave
# in-body H1s alone -- our front-matter sets page.title explicitly, and CSS
# hides the duplicate H1 inside .post-content.
titles_from_headings:
  strip_title: false

# Social share card. Set via front-matter defaults rather than a top-level
# `image:` key -- defaults is the mechanism jekyll-seo-tag documents, and it
# applies the card to every page including 404.
defaults:
  - scope:
      path: ""
    values:
      last_modified_at: 2026-09-21
      image:
        path: /assets/og-card.png
        width: 1200
        height: 630
        alt: >-
          FitToll — pay the toll to scroll. Camera-verified push-ups or squats
          to open the apps you doomscroll.

# Emitted as sameAs, tying this domain to both store listings as one entity.
# Only URLs verified to exist — no placeholder social profiles.
social:
  name: FitToll

# G-17 [SITE-M-01]: keep internal docs off the public site.
exclude:
  - correspondence/
  - README.md
  - scripts/
  - .fonts/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .sass-cache/
