<footer class="site-footer" role="contentinfo">
  <div class="site-footer-inner">
    <p class="site-footer-line">
      <img class="site-footer-mark" src="{{ '/assets/favicon-192.png' | relative_url }}" alt="" width="22" height="22" loading="lazy" decoding="async">
      &copy; {{ 'now' | date: '%Y' }} FitToll
      <span aria-hidden="true">·</span>
      <span class="site-footer-url">{{ site.url | remove_first: 'https://' | remove_first: 'http://' }}</span>
      <span aria-hidden="true">·</span>
      <span class="site-footer-tag">{{ site.description }}</span>
    </p>
    <nav class="site-footer-nav" aria-label="Legal">
      <a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a>
      <a href="{{ '/terms-of-use/' | relative_url }}">Terms</a>
    </nav>
  </div>
</footer>
